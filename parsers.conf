[PARSER]
    Name        dns_bind_parser
    Format      regex

    Regex ^(?<timestamp>\d{2}-[A-Za-z]{3}-\d{4}\s+\d{2}:\d{2}:\d{2}\.\d+)\s+client\s+(?:@\S+\s+)?(?<client_ip>[\da-fA-F:\.]+)#(?<client_port>\d+)(?:\s+\((?<server>[^\)]*)\))?:\s+query:\s+(?<domain>\S+)\s+(?<query_class>\S+)\s+(?<query_type>\S+)\s+(?<flags>\S+)(?:\s+\((?<resolver>[^\)]*)\))?

    Time_Key    timestamp
    Time_Format %d-%b-%Y %H:%M:%S.%L
