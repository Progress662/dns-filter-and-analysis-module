[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

    Parsers_File /home/rohan/Desktop/project(fluentbit-kafka)/parsers.conf


#####################################################
# INPUT
#####################################################

[INPUT]
    Name              tail
    Path              /var/cache/bind/query.log
    Tag               dns
    Read_from_Head    False
    Parser            dns_bind_parser


#####################################################
# Preserve original log
#####################################################

[FILTER]
    Name          modify
    Match         dns

    Copy          log raw_log


#####################################################
# OUTPUT
#####################################################

[OUTPUT]
    Name      kafka
    Match     *
    Brokers   localhost:9092
    Topics    dns-logs
    Format    json
